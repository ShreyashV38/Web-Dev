<!DOCTYPE html>
<html>

<head>
    <title>Assignment 5 - Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>

</head>

<body>

    <div class="login-wrapper" id="auth-box" style="display: none;">
        <div class="tab-container">
            <button class="tab-btn active" id="tab-login">Login</button>
            <button class="tab-btn" id="tab-signup">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form id="login-form">
            <h2>Student Login</h2>
            <div class="form-group">
                <label>Email ID:</label>
                <input type="email" id="login-email" name="email" required>
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="login-password" name="password" required>
            </div>
            <input class="btn" type="submit" value="Login">
        </form>

        <!-- Sign-Up Form -->
        <form id="signup-form" style="display: none;">
            <h2>Student Registration</h2>
            <div class="form-group">
                <label>Email ID:</label>
                <input type="email" id="signup-email" name="email" required>
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="signup-password" name="password" required>
            </div>
            <div class="form-group">
                <label>Upload Profile Image (Max 2MB):</label>
                <input type="file" id="profile-pic" accept="image/*" required>
                <div id="pic-error" class="error-text"></div>
            </div>
            <div class="form-group">
                <label>Upload CV (.pdf or .docx):</label>
                <input type="file" id="resume-file" accept=".pdf, .docx" required>
                <div id="resume-error" class="error-text"></div>
            </div>
            <input class="btn btn-signup" type="submit" value="Register">
        </form>
    </div>
</body>

</html>
